site_name: Puppy Chat
site_description: Documentation and usage guide for Puppy Chat — a warm macOS assistant workspace connected to self-hosted SGLang models.
site_url: https://puppychat.readthedocs.io/
repo_url: https://github.com/shivajid/puppychat
repo_name: shivajid/puppychat
edit_uri: edit/main/docs/

theme:
  name: material
  logo: assets/puppy-chat.svg
  favicon: assets/puppy-chat.svg
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.instant
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
  palette:
    # Warm paper palette matching the app (#FAF9F5 / #1F1E1D)
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: brown
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: brown
      accent: orange
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

extra_css:
  - stylesheets/custom.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Home: index.md
  - Usage guide: usage-guide.md
  - User guide: user-guide.md
  - Setup & installation: setup.md
  - For teams:
      - Teammate quick start: team-quick-start.md
      - Team deployment (admin): team-admin.md
  - Development: development.md

validation:
  nav:
    omitted_files: info
    not_found: warn
    absolute_links: warn
  links:
    not_found: warn
    absolute_links: warn
